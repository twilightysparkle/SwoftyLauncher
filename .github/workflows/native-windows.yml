name: Native Windows

on:
  workflow_dispatch:

jobs:
  guard:
    name: Guard tests on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false
      - name: Guard tests
        shell: bash
        run: bash native/test/run_guard_test.sh
      - name: Memory page checks
        if: always()
        shell: bash
        run: bash native/test/run_mem_pages_test.sh
      - name: Import table walk
        if: always()
        shell: bash
        run: bash native/test/run_pe_imports_test.sh
      - name: GPU Engine counter calls
        if: always()
        shell: bash
        run: bash native/test/run_pdh_test.sh
